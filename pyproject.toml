[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evoundo"
version = "0.1.0"
description = "EvoUndo: Recoverability for autonomous agents"
readme = "README.md"
authors = [
    { name = "Tanmay Sah" },
    { name = "Dolly Sah" }
]
license = { text = "PolyForm Noncommercial 1.0.0" }
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "requests>=2.28.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/evoundo/evoundo"
Documentation = "https://github.com/evoundo/evoundo#readme"
Repository = "https://github.com/evoundo/evoundo"

[project.optional-dependencies]

redis = [
    "redis>=5.0.0",
]

mysql = [
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
]

orm = [
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
]

langgraph = [
    "langgraph>=1.2.0",
    "langchain>=1.3.0",
]

google-adk = [
    "google-genai>=2.0.0",
]

openai = [
    "openai>=2.0.0",
]

openai-agents = [
    "openai-agents>=0.1.0",
    "openai>=2.0.0",
]

crewai = [
    "crewai>=1.0.0; python_version < '3.14'",
]

autogen = [
    "autogen-agentchat>=0.7.0; python_version < '3.14'",
    "ag2>=1.0.0; python_version < '3.14'",
]

microsoft-agent = [
    "pydantic>=2.0.0",
]

strands = [
    "pydantic>=2.0.0",
]

llamaindex = [
    "llama-index>=0.14.0",
    "llama-index-core>=0.14.0",
]

pydantic-ai = [
    "pydantic-ai>=2.30.0",
]

mcp = [
    "mcp>=1.20.0",
]

anthropic = [
    "anthropic>=1.0.0",
]

test = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
]

all = [
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "langgraph>=1.2.0",
    "langchain>=1.3.0",
    "google-genai>=2.0.0",
    "openai>=2.0.0",
    "crewai>=1.0.0; python_version < '3.14'",
    "autogen-agentchat>=0.7.0; python_version < '3.14'",
    "ag2>=1.0.0; python_version < '3.14'",
    "llama-index>=0.14.0",
    "llama-index-core>=0.14.0",
    "pydantic-ai>=2.30.0",
    "mcp>=1.20.0",
    "anthropic>=1.0.0",
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
evoundo = "evoundo.cli.main:main"

[tool.setuptools.packages.find]
include = [
    "evoundo",
    "evoundo.*",
]

exclude = [
    "tests*",
    "examples*",
    "audit*",
]

[tool.setuptools.package-data]
evoundo = [
    "py.typed",
    "studio/static/*",
    "studio/static/**/*",
]

"*" = [
    "*.html",
    "*.js",
    "*.css",
    "*.json",
    "*.yaml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]